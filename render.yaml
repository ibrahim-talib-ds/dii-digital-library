services:
  - type: web
    name: dii-library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: |
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 /tmp/flutter
      export PATH="$PATH:/tmp/flutter/bin"
      flutter config --enable-web
      flutter pub get
      flutter build web --release --dart-define=API_BASE=https://dii-digital-library.onrender.com
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: FLUTTER_VERSION
        value: stable
