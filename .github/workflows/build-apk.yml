name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APKs (split per ABI for smaller size)
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Rename APKs
        run: |
          mkdir -p build/app/outputs/flutter-apk/renamed
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .apk)
            base=${base/app-/dii-library-}
            base=${base/-release/}
            cp "$f" "build/app/outputs/flutter-apk/renamed/$base.apk"
          done
          ls -la build/app/outputs/flutter-apk/renamed/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: dii-library-arm64-v8a
          path: build/app/outputs/flutter-apk/renamed/dii-library-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: dii-library-armeabi-v7a
          path: build/app/outputs/flutter-apk/renamed/dii-library-armeabi-v7a.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: dii-library-x86_64
          path: build/app/outputs/flutter-apk/renamed/dii-library-x86_64.apk
          if-no-files-found: warn
